    document.getElementById('lang-en').classList.toggle('active', lang === 'en');
    document.getElementById('lang-te').classList.toggle('active', lang === 'te');
    renderAll();
  }

  function renderHeader() {
    const cfg = window.elementSdk?.config || defaultConfig;
    const title = currentLang === 'en' 
      ? (cfg.app_title_en || defaultConfig.app_title_en)
      : (cfg.app_title_te || defaultConfig.app_title_te);
    const subtitle = currentLang === 'en'
      ? (cfg.app_subtitle_en || defaultConfig.app_subtitle_en)
      : (cfg.app_subtitle_te || defaultConfig.app_subtitle_te);
    
    const titleEl = document.getElementById('app-title');
    const subEl = document.getElementById('app-subtitle');
    titleEl.textContent = title;
    subEl.textContent = subtitle;
    titleEl.classList.toggle('font-telugu', currentLang === 'te');
    subEl.classList.toggle('font-telugu', currentLang === 'te');
    
    document.getElementById('brand-tag').textContent = ui[currentLang].brandTag;
    document.getElementById('brand-sub').textContent = ui[currentLang].brandSub;
    document.getElementById('tips-tag').textContent = ui[currentLang].tipsTag;
    document.getElementById('tips-title').textContent = ui[currentLang].tipsTitle;
    document.getElementById('footer-text').textContent = ui[currentLang].footer;
    
    document.getElementById('tips-title').classList.toggle('font-telugu', currentLang === 'te');
    document.getElementById('footer-text').classList.toggle('font-telugu', currentLang === 'te');
  }

  function renderCategories() {
    const categories = ['all', ...new Set(fertilizers.map(f => f.category.en))];
    const container = document.getElementById('category-filter');
    container.innerHTML = categories.map(cat => {
      const label = cat === 'all' 
        ? ui[currentLang].all 
        : (currentLang === 'en' 
            ? cat 
            : fertilizers.find(f => f.category.en === cat).category.te);
      const active = currentCategory === cat;
      return `<button 
        onclick="setCategory('${cat}')" 
        class="category-btn ${active ? 'active' : 'bg-white text-[#2d3319] hover:bg-[#ebe3d3]'} px-4 py-2 rounded-full text-sm font-semibold ${currentLang === 'te' ? 'font-telugu' : ''}"
      >${label}</button>`;
    }).join('');
  }

  function setCategory(cat) {
    currentCategory = cat;
    renderCategories();
    renderGrid();
  }

  function renderGrid() {
    const container = document.getElementById('fertilizer-grid');
    const filtered = currentCategory === 'all' 
      ? fertilizers 
      : fertilizers.filter(f => f.category.en === currentCategory);
    
    container.innerHTML = filtered.map(f => {
      const isSelected = f.id === selectedId;
      return `
        <button 
          onclick="selectFertilizer('${f.id}')"
          class="card-shadow card-shadow-hover bg-white rounded-2xl p-5 text-left transition-all ${isSelected ? 'ring-2 ring-[#2d3319]' : ''}"
        >
          <div class="flex items-start justify-between mb-4">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background:${f.bg}">
              <i data-lucide="${f.icon}" style="width: 22px; height: 22px; color: ${f.color};"></i>
            </div>
            <span class="tag px-2 py-1 rounded-md ${currentLang === 'te' ? 'font-telugu' : ''}" style="background:${f.bg}; color:${f.color}">
              ${f.category[currentLang]}
            </span>
          </div>
          <h3 class="font-display text-xl font-bold text-[#2d3319] mb-1 ${currentLang === 'te' ? 'font-telugu' : ''}">
            ${f.name[currentLang]}
          </h3>
          <div class="text-xs text-[#6b7355] mb-3 font-mono">${f.formula}</div>
          <p class="text-sm text-[#4a5338] leading-relaxed line-clamp-2 ${currentLang === 'te' ? 'font-telugu' : ''}">
            ${f.description[currentLang]}
          </p>
          <div class="mt-4 pt-3 border-t border-[#ebe3d3] flex items-center gap-1.5 text-xs font-semibold text-[#658a42] ${currentLang === 'te' ? 'font-telugu' : ''}">
            <i data-lucide="zap" style="width: 12px; height: 12px;"></i>
            ${f.nutrient[currentLang]}
          </div>
        </button>
      `;
    }).join('');
    lucide.createIcons();
  }

  function selectFertilizer(id) {
    selectedId = id;
    renderGrid();
    renderDetail();
  }

  function renderDetail() {
    const f = fertilizers.find(x => x.id === selectedId);
    const panel = document.getElementById('detail-panel');
    if (!f) {
      panel.innerHTML = `
        <div class="p-8 text-center">
          <i data-lucide="hand-pointer" class="mx-auto mb-3 text-[#8a9466]" style="width: 40px; height: 40px;"></i>
          <h3 class="font-display text-lg font-bold text-[#2d3319]">${ui[currentLang].selectFert}</h3>
          <p class="text-sm text-[#6b7355] mt-2">${ui[currentLang].selectDesc}</p>
        </div>`;
      lucide.createIcons();
      return;
    }
    
    const teClass = currentLang === 'te' ? 'font-telugu' : '';
    
    panel.innerHTML = `
      <div class="detail-section">
        <div class="p-6 border-b border-[#ebe3d3]" style="background: linear-gradient(135deg, ${f.bg} 0%, #ffffff 100%)">
          <div class="flex items-start gap-4">
            <div class="w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${f.color}">
              <i data-lucide="${f.icon}" class="text-white" style="width: 26px; height: 26px;"></i>
            </div>
            <div class="min-w-0">
              <div class="tag mb-1 ${teClass}" style="color:${f.color}">${f.category[currentLang]}</div>
              <h2 class="font-display text-2xl font-bold text-[#2d3319] leading-tight ${teClass}">${f.name[currentLang]}</h2>
              <div class="text-xs text-[#6b7355] mt-1 font-mono">${f.formula}</div>
            </div>
          </div>
        </div>
        
        <div class="p-6 space-y-5 max-h-[600px] overflow-y-auto">
          <p class="text-[#2d3319] leading-relaxed ${teClass}">${f.description[currentLang]}</p>
          
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-[#f4efe6] rounded-xl p-3">
              <div class="tag text-[#658a42] mb-1 ${teClass}">${ui[currentLang].nutrient}</div>
              <div class="text-sm font-bold text-[#2d3319] ${teClass}">${f.nutrient[currentLang]}</div>
            </div>
            <div class="bg-[#f4efe6] rounded-xl p-3">
              <div class="tag text-[#658a42] mb-1 ${teClass}">${ui[currentLang].formula}</div>
              <div class="text-sm font-bold text-[#2d3319] font-mono">${f.formula}</div>
            </div>
          </div>
          
          <div>
            <div class="flex items-center gap-2 mb-3">
              <i data-lucide="book-open" class="text-[#658a42]" style="width: 16px; height: 16px;"></i>
              <h4 class="tag text-[#658a42] ${teClass}">${ui[currentLang].usage}</h4>
            </div>
            <ul class="space-y-2">
              ${f.usage[currentLang].map((u, i) => `
                <li class="flex gap-3 text-sm text-[#2d3319] ${teClass}">
                  <span class="flex-shrink-0 w-5 h-5 rounded-full bg-[#2d3319] text-[#c9d080] text-xs font-bold flex items-center justify-center mt-0.5">${i+1}</span>
                  <span class="leading-relaxed">${u}</span>
                </li>
              `).join('')}
            </ul>
          </div>
          
          <div class="bg-[#2d3319] rounded-xl p-4">
            <div class="flex items-center gap-2 mb-2">
              <i data-lucide="wheat" class="text-[#c9d080]" style="width: 16px; height: 16px;"></i>
              <div class="tag text-[#c9d080] ${teClass}">${ui[currentLang].crops}</div>
            </div>
            <div class="text-sm font-semibold text-[#f4efe6] ${teClass}">${f.crops[currentLang]}</div>
          </div>
        </div>
      </div>
    `;
    lucide.createIcons();
  }

  function renderTips() {
    const container = document.getElementById('tips-grid');
    const teClass = currentLang === 'te' ? 'font-telugu' : '';
    container.innerHTML = tips[currentLang].map(t => `
      <div class="bg-[#3d4623] rounded-xl p-4 border border-[#4a5338]">
        <div class="w-9 h-9 rounded-lg bg-[#c9d080] flex items-center justify-center mb-3">
          <i data-lucide="${t.icon}" class="text-[#2d3319]" style="width: 18px; height: 18px;"></i>
        </div>
        <h4 class="font-bold text-[#f4efe6] mb-1 ${teClass}">${t.title}</h4>
        <p class="text-sm text-[#c9d080] leading-relaxed ${teClass}">${t.text}</p>
      </div>
    `).join('');
    lucide.createIcons();
  }

  function renderAll() {
    renderHeader();
    renderCategories();
    renderGrid();
    renderDetail();
    renderTips();
  }

  // ============ Element SDK ============
  if (window.elementSdk) {
    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => {
        renderHeader();
      },
      mapToCapabilities: () => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['app_title_en', config.app_title_en || defaultConfig.app_title_en],
        ['app_title_te', config.app_title_te || defaultConfig.app_title_te],
        ['app_subtitle_en', config.app_subtitle_en || defaultConfig.app_subtitle_en],
        ['app_subtitle_te', config.app_subtitle_te || defaultConfig.app_subtitle_te]
      ])
    });
  }

  // Initial render
  renderAll();
</script>
